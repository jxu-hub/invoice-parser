name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件没有 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: 200 张表的 golden 回归
        run: go test ./... -count=1

      - name: v1 vs v2 通过率
        run: go run ./scripts/baseline.go
